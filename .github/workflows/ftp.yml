name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload Resourcepack
        uses: actions/upload-artifact@v7
        with:
          name: ssbrc-ost-latest
          path: |
            assets/
            pack.mcmeta
            pack.png
